# AI Sahayak – nginx config for EC2 (port 80)
# After build, copy dist to /var/www/ai-sahayak (see below), then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10M;

    # Main app (React)
    location / {
        root /var/www/ai-sahayak/frontend;
        try_files $uri $uri/ /index.html;
    }

    # Dashboard / Control Centre (React)
    location /control-centre/ {
        alias /var/www/ai-sahayak/control-centre/;
        try_files $uri $uri/ index.html;
    }

    # Dashboard Flask API (KPI load, price, etc. – can be slow on first request)
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
